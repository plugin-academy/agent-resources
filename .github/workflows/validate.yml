name: Validate and package metadata
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate && npm test && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: agent-resources-${{ github.sha }}
          path: dist/
          include-hidden-files: true
